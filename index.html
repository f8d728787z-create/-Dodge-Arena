<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dodge Arena</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu" class="screen active">

    <div class="menuBox">

        <div class="logo">DODGE</div>
        <div class="subtitle">ARENA</div>

        <div class="profileName">
            👤 <span id="menuPlayerName">Spieler</span>
        </div>

        <div class="coinDisplay">
            🪙 <span id="menuCoins">0</span>
        </div>

        <p class="menuText">
            Wähle deinen Modus
        </p>

        <button id="normalButton"
                class="modeButton normal">
            🟢 NORMAL
            <span>2 ❤️</span>
        </button>

        <button id="hardcoreButton"
                class="modeButton hardcore">
            🔴 HARDCORE
            <span>1 ❤️ • Keine Power-ups</span>
        </button>

        <button id="nameButton"
                class="menuButton">
            ✏️ Namen ändern
        </button>

        <button id="shopButton"
                class="menuButton">
            🏪 SHOP
        </button>

        <button id="leaderboardButton"
                class="menuButton">
            🏆 BESTENLISTE
        </button>

        <div class="highscoreBox">
            🏆 Highscore:
            <span id="menuHighscore">0</span>
        </div>

    </div>

</div>


<!-- ================= NAME ================= -->

<div id="nameScreen" class="screen">

    <div class="nameBox">

        <h1>👤 Dein Name</h1>

        <p>
            Wie möchtest du im Spiel heißen?
        </p>

        <input
            id="nameInput"
            type="text"
            maxlength="16"
            placeholder="Dein Name"
            autocomplete="off"
        >

        <div id="nameError"></div>

        <button id="saveNameButton">
            ✓ Speichern
        </button>

        <button id="nameBackButton"
                class="backButton">
            ← Zurück
        </button>

    </div>

</div>


<!-- ================= SHOP ================= -->

<div id="shop" class="screen">

    <div class="shopBox">

        <h1>🏪 SHOP</h1>

        <div class="shopCoins">
            🪙 <span id="shopCoins">0</span>
        </div>

        <div id="skinList"></div>

        <button id="shopBackButton"
                class="backButton">
            ← Zurück
        </button>

    </div>

</div>


<!-- ================= LEADERBOARD ================= -->

<div id="leaderboard" class="screen">

    <div class="leaderboardBox">

        <h1>🏆 BESTENLISTE</h1>

        <div class="leaderboardModes">

            <button id="leaderboardNormalButton">
                🟢 NORMAL
            </button>

            <button id="leaderboardHardcoreButton">
                🔴 HARDCORE
            </button>

        </div>

        <div id="leaderboardList">
            <p>Wähle eine Bestenliste.</p>
        </div>

        <button id="leaderboardBackButton"
                class="backButton">
            ← Zurück
        </button>

    </div>

</div>


<!-- ================= GAME ================= -->

<div id="gameScreen" class="screen">

    <div id="topBar">

        <button id="pauseButton">
            Ⅱ
        </button>

        <div id="score">
            SCORE: 0
        </div>

        <div id="lives">
            ❤️❤️
        </div>

    </div>

    <canvas id="gameCanvas"></canvas>

</div>


<!-- ================= PAUSE ================= -->

<div id="pauseMenu" class="overlay">

    <div class="pauseBox">

        <h1>⏸️ PAUSE</h1>

        <button id="resumeButton">
            ▶️ Weiterspielen
        </button>

        <button id="pauseMenuButton">
            🏠 Hauptmenü
        </button>

    </div>

</div>


<!-- ================= GAME OVER ================= -->

<div id="gameOver" class="overlay">

    <div class="gameOverBox">

        <div class="gameOverTitle">
            GAME OVER
        </div>

        <div id="finalScore">
            Score: 0
        </div>

        <div id="coinsEarned">
            🪙 +0 Coins
        </div>

        <div id="newHighscore">
            🏆 NEUER HIGHSCORE!
        </div>

        <button id="restartButton">
            🔄 Nochmal spielen
        </button>

        <button id="gameOverMenuButton">
            🏠 Menü
        </button>

    </div>

</div>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ================= GAME JS ================= -->

<script src="script.js"></script>

</body>
</html>
